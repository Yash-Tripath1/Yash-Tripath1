name: Refresh Profile Assets

# Regenerates profile SVGs from live GitHub data and commits them.
# The open-source panel uses public PR/issue data, excludes the profile owner's
# own repositories, and keeps the last good snapshot if a fetch is incomplete.
# No third-party image host or additional secret is required.

on:
  schedule:
    # 02:17 UTC every day (~07:47 IST)
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # only these paths — the bot's own commit to assets/ and data/ never re-triggers
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check profile generators
        run: python3 -m unittest discover -s tests -v

      - name: Pull public open-source contributions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_open_source.py --user Yash-Tripath1

      - name: Rebuild mission-control panel and README counters
        run: python3 scripts/gen_open_source.py --update-readme

      - name: Pull contribution calendar
        run: python3 scripts/fetch_contributions.py --user Yash-Tripath1

      - name: Rebuild activity graph
        run: python3 scripts/gen_hero.py

      - name: Rebuild banner
        run: python3 scripts/gen_banner.py

      - name: Commit refreshed assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data README.md
          if git diff --quiet --cached; then
            echo "profile assets already up to date"
          else
            git commit -m "chore(assets): refresh profile + open-source impact"
            git push
          fi
